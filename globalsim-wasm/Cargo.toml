[package]
name = "globalsim-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Thin wasm-bindgen wrapper around the pinned GlobalSim engine; all glue lives here, GlobalSim is consumed unmodified."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
globalsim = { package = "race_engine_rs", path = "../vendor/GlobalSim", default-features = false, features = ["external-geometry"] }
wasm-bindgen = "0.2"
# run_compact reads the frameless metadata reply and builds the compact record.
# float_roundtrip: exact f64 parse/serialize — without it serde is 1 ULP off on
# some 17-digit values, which shifts finishTimeRaw and cascades into the tail grid.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Catch engine panics as a rejected run instead of trapping and killing the
# worker; input validation still happens in TypeScript first.
panic = "unwind"

[profile.dev]
panic = "unwind"
