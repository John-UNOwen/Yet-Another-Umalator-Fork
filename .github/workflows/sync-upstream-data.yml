name: Sync upstream Global data

# Hands-off pull, human merge. alpha123 pushes Global game data constantly; this
# pulls it in, verifies it builds and passes the engine tests, then opens a PULL
# REQUEST against master (the fork's Pages deploy branch) — no direct commits to
# any branch. The rules that make a blind merge unsafe are enforced inside
# tools/sync-upstream-data.mjs, which aborts without writing if any guard trips;
# a tripped guard fails the run loudly instead of opening a PR. Merging the PR is
# what deploys the data to the live Pages site (pages.yml), and the coverage gate
# below shows there whether a brand-new skill needs a GlobalSim supplement entry
# before merge (docs/globalsim-upgrade.md).

on:
  schedule:
    - cron: '17 5 * * *'      # daily, offset off the hour
  workflow_dispatch:           # and on demand

concurrency:
  group: sync-upstream-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # need real history so the script's git operations work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull upstream data
        id: sync
        run: |
          node tools/sync-upstream-data.mjs
          if [ -f .sync-summary.txt ]; then
            echo "summary=$(cat .sync-summary.txt)" >> "$GITHUB_OUTPUT"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the result actually builds
        if: steps.sync.outputs.changed == 'yes'
        run: |
          npm ci --no-audit --no-fund
          cd umalator-global && node build.mjs
          cd v2 && npx vite build

      - name: Run engine tests
        if: steps.sync.outputs.changed == 'yes'
        run: cd uma-skill-tools && npm ci --no-audit --no-fund && npm test

      - name: GlobalSim coverage gate (informational for the PR)
        if: steps.sync.outputs.changed == 'yes'
        continue-on-error: true
        run: |
          # New in-game skills without engine definitions fail this gate: that is the
          # signal to supplement globalsim/skills-supplement.json before merging.
          node tools/globalsim-coverage.mjs --write

      - name: Commit + open PR against master
        if: steps.sync.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .sync-summary.txt globalsim/coverage-report.md   # report refresh is not part of the sync PR
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # data only. bundles are rebuilt by Pages; never commit build output here.
          git add umalator-global/skill_data.json \
                  umalator-global/skillnames.json \
                  umalator-global/course_data.json \
                  umalator-global/tracknames.json \
                  umalator-global/global-live-skills.json \
                  umalator-global/not-in-game.json
          if git diff --cached --quiet; then
            echo "nothing staged after all"; exit 0
          fi
          BRANCH="sync/upstream-data-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data: sync Global data from upstream" \
                     -m "${{ steps.sync.outputs.summary }}" \
                     -m "Automated by .github/workflows/sync-upstream-data.yml."
          git push origin "HEAD:$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "data: sync Global data from upstream" \
            --body "Automated daily upstream data sync. Summary: ${{ steps.sync.outputs.summary }}

          Merge to deploy to the Pages site. If the *GlobalSim coverage gate* step failed, a brand-new skill has no engine definition yet — supplement \`globalsim/skills-supplement.json\` first (docs/globalsim-upgrade.md)." \
            || echo "PR already exists or gh failed — branch pushed: $BRANCH"
