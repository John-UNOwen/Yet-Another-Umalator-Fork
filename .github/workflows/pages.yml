# GitHub Pages deployment for the GlobalSim fork (integration plan Phase 6).
#
# The v2 app is the site root: _site/ = vite dist + the runtime assets it
# fetches (icons/, fonts/, globalsim/). The asset prefix is NOT hardcoded —
# CC_BASE_PATH is filled from the repo name, so the Pages project works under
# any repo name (and a root-level/custom-domain deploy just sets CC_BASE_PATH='').
# Pages ignores _redirects/Functions, so no Cloudflare-era routing here.
#
# Cloudflare-dependent features build inert: empty OCR_PROXY_URL (OCR falls
# back to a user-supplied Gemini key) and empty TURNSTILE_SITEKEY.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Same cache + key as ci.yml (both runners are Linux, so the two
      # workflows share the binary): wasm-pack is compiled from crates.io,
      # pinned — a wasm-bindgen CLI that mismatches the lib in the lockfile
      # breaks pkg generation. Install only on cache miss.
      - name: Cache wasm-pack 0.15.1
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.15.1

      - name: Install wasm-pack 0.15.1
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.1 --locked

      - name: Build globalsim-wasm
        working-directory: globalsim-wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build the v2 site
        env:
          CC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build:v2

      # The on-device OCR binaries stay out of git. Fetched here from pinned revisions and
      # checked against ocr/MANIFEST.json, so a re-uploaded model fails the deploy.
      - name: Fetch and verify the OCR assets
        run: node tools/fetch-ocr-assets.mjs

      - name: Assemble globalsim runtime assets
        run: |
          mkdir -p globalsim/wasm globalsim/geometry
          cp globalsim-wasm/pkg/globalsim_wasm.js globalsim-wasm/pkg/globalsim_wasm_bg.wasm globalsim/wasm/
          cp vendor/GlobalSim/data/course_geometry/*.json globalsim/geometry/
          node tools/globalsim-coverage.mjs --out globalsim/skills.json   # the CI coverage gate, too
          # courses.json is committed; regenerate from the engine's course table if missing.
          # Must stay identical to generateGlobalsimAssets() part (iii) in umalator-global/build.mjs:
          # STRING keys of vendor/GlobalSim/data/course_data.json — the app gate does
          # Set(ids).has(String(courseId)), so numeric ids would reject every course.
          test -f globalsim/courses.json || node -e "
            const fs=require('fs');
            const ids = Object.keys(JSON.parse(fs.readFileSync('vendor/GlobalSim/data/course_data.json','utf-8')));
            fs.writeFileSync('globalsim/courses.json', JSON.stringify(ids) + '\n');
          "
          # Third-party license notices bundled by the engine (upstream ships no top-level LICENSE)
          mkdir -p globalsim/licenses && cp vendor/GlobalSim/licenses/*.txt globalsim/licenses/

      - name: Prepare Pages artifact
        env:
          CC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          # _site receives only what the site serves — no git, no mdb, no sources.
          mkdir -p _site
          cp -r umalator-global/v2/dist/. _site/
          cp -r icons fonts _site/
          cp -r globalsim _site/globalsim
          cp -r ocr _site/ocr
          cp og-image-v2.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
